<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Eisenbuch</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eisenbuch">
<meta name="theme-color" content="#0f141a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0f141a}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app. Sticky header, scrolling content, fixed bottom tab bar.
   Dark-committed single theme (gym at night: charcoal rubber floor, hot orange plates). */
:root{
  color-scheme:dark;
  --bg:#0f141a;          /* page ground */
  --surface:#151b23;     /* cards */
  --surface-2:#1d2630;   /* raised controls */
  --line:#2a3542;        /* hairlines */
  --fg:#f2f4f7;          /* primary ink */
  --fg-2:#aab4c0;        /* secondary ink */
  --fg-3:#6f7c8a;        /* muted ink */
  --accent:#f0602a;      /* hot orange */
  --accent-ink:#1a0d07;  /* text on accent */
  --accent-soft:rgba(240,96,42,.16);
  --s1:#f0602a; --s2:#3b8fe8; --s3:#17a37a; --s4:#c98500;  /* chart series, validated on --surface */
  --good:#2fbf71; --warn:#e0a120; --bad:#e35353;
  --font-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --radius:14px;
  --tabbar:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.4;overflow:hidden;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:30px;font-weight:800;text-transform:uppercase}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3);font-weight:600}
.muted{color:var(--fg-2)}
.small{font-size:13px}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px}

#app{height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 70%,rgba(15,20,26,0));padding:14px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header.top .brand{display:flex;align-items:baseline;gap:8px}
header.top .brand span{color:var(--accent)}
body.resting main{padding-bottom:calc(var(--tabbar) + 100px + env(safe-area-inset-bottom,0px))}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
main > *{min-width:0;flex-shrink:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#0b0f14;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg-3);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:6px 0;border-radius:10px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.card{background:var(--surface);border-radius:var(--radius);padding:16px}
.card.flat{background:none;padding:0}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:var(--line);color:var(--fg-2)}
.btn.danger{color:var(--bad);border-color:rgba(227,83,83,.4)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.emo:focus-visible,.chip:focus-visible,.stepbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Check-in smileys */
.checkin .q{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.checkin .q:first-of-type{border-top:0;padding-top:0}
.checkin .q .lbl{display:flex;justify-content:space-between;align-items:baseline}
.checkin .q .lbl b{font-weight:600}
.emos{display:flex;gap:6px}
.emo{flex:1;aspect-ratio:1;max-height:56px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:26px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.emo.on{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.06)}

/* Exercise block during workout */
.ex{padding:0;overflow:hidden}
.ex .exhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;gap:10px}
.ex .exhead h3{font-size:20px}
.ex .last{padding:0 16px 10px;font-size:13px;color:var(--fg-2)}
.ex .last b{color:var(--fg)}
.sets{display:flex;flex-direction:column}
.set{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.set .n{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--fg-3)}
.set .vals{display:flex;gap:6px;flex-wrap:wrap;font-weight:600}
.set .vals .v{background:var(--surface-2);border-radius:8px;padding:4px 8px;font-size:15px}
.set .vals .v small{color:var(--fg-3);font-weight:500;font-size:12px;margin-left:2px}
.set .rpe-pill{display:inline-block;min-width:34px;text-align:center;border-radius:8px;padding:4px 8px;font-weight:700;color:#10151b;font-size:15px}
.set.done .n{color:var(--good)}
.set .edit{color:var(--fg-3);font-size:13px}
.pr{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.exfoot{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}

/* Set editor (sheet) */
.sheet-bg{position:fixed;inset:0;background:rgba(5,8,12,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.stepper{display:grid;grid-template-columns:52px 52px 1fr 52px 52px;gap:6px;align-items:center}
.stepper.narrow{grid-template-columns:52px 1fr 52px}
.stepbtn{height:52px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:18px}
.stepbtn small{display:block;font-size:11px;font-weight:600;color:var(--fg-3);margin-top:-2px}
.bigval{height:52px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:34px;background:var(--bg);border:1px solid var(--line);border-radius:12px;width:100%;min-width:0;padding:0 6px;-moz-appearance:textfield}
.bigval::-webkit-inner-spin-button,.bigval::-webkit-outer-spin-button{-webkit-appearance:none}
.unitlbl{text-align:center;font-size:12px;color:var(--fg-3);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.rpescale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chip{height:50px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1}
.chip small{font-family:var(--font-body);font-size:10px;font-weight:600;color:var(--fg-3);margin-top:3px;letter-spacing:.02em}
.chip.on{color:#10151b;border-color:transparent}
.chip.on small{color:rgba(16,21,27,.75)}
.rpeinfo{display:flex;justify-content:space-between;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.rpeinfo b{font-family:var(--font-display);font-size:18px}

/* Rest timer */
.rest{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar) + 10px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.rest .t{font-family:var(--font-display);font-weight:800;font-size:34px;min-width:76px}
.rest .bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.rest .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width 1s linear}
.rest.over .bar i{background:var(--good)}

/* Picker */
.search{width:100%;height:46px;border-radius:12px;background:var(--bg);border:1px solid var(--line);padding:0 14px;font-size:16px}
.plist{display:flex;flex-direction:column}
.plist .grp{padding:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3);font-weight:600}
.plist button{text-align:left;padding:12px 4px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.plist button span.en{color:var(--fg-3);font-size:13px}
.tag{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--fg-2);white-space:nowrap}

/* History */
.wk{display:flex;flex-direction:column;gap:8px}
.wk .head{display:flex;justify-content:space-between;align-items:baseline}
.wk .emoline{font-size:18px;letter-spacing:2px}
.wk .exs{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--fg-2)}
.wk .exs b{color:var(--fg);font-weight:600}
.wk .meta{display:flex;gap:14px;font-size:13px;color:var(--fg-3)}

/* Stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:12px;padding:12px}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1}
.tile .l{font-size:12px;color:var(--fg-3);margin-top:4px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--fg-3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;background:var(--surface-2);color:var(--fg-2)}
.cal .d.off{background:none;color:var(--fg-3);opacity:.5}
.cal .d.has{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal .d.today{outline:2px solid var(--fg-2);outline-offset:-2px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg-2)}
.seg button.on{background:var(--surface);color:var(--fg)}
select.sel{width:100%;height:46px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);padding:0 12px;font-size:16px}
.insight{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px}
.tooltip{position:absolute;pointer-events:none;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--fg);white-space:nowrap;z-index:3;transform:translate(-50%,-110%)}
.chartwrap{position:relative}

/* More */
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0;padding-top:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--fg-2);font-weight:600}
.input{height:46px;border-radius:12px;background:var(--bg);border:1px solid var(--line);padding:0 12px;font-size:16px;width:100%}
textarea.input{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90%}
.empty{text-align:center;color:var(--fg-2);padding:30px 10px}
.empty .big{font-size:40px;margin-bottom:8px}
.demo-banner{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--fg-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{padding:18px 16px;background:linear-gradient(135deg,#1b2430,#121820);border:1px solid var(--line)}
.hero .dur{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1}
.hero .kpis{display:flex;gap:18px;margin-top:8px}
.hero .kpis div b{display:block;font-family:var(--font-display);font-size:22px;font-weight:700}
.hero .kpis div span{font-size:12px;color:var(--fg-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:600px){main{max-width:600px;width:100%;margin:0 auto}header.top{max-width:600px;width:100%;margin:0 auto}}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><h1>Eisen<span>buch</span></h1></div>
    <div id="hdr-right" class="small muted"></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="train" class="on"><svg viewBox="0 0 24 24"><path d="M3 10v4M21 10v4M6 8v8M18 8v8M6 12h12"/></svg>Training</button>
    <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 5h16v16H4zM4 10h16M9 5V3M15 5V3"/></svg>Verlauf</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 16l4-5 4 3 5-7"/></svg>Statistik</button>
    <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Mehr</button>
  </nav>
  <div id="overlay"></div>
  <div id="rest" class="rest" hidden></div>
</div>

<script>
/* ========= Daten ========= */
const KEY='eisenbuch.v1';
const DEFAULT_EXERCISES=[
 // id, name, en, type (w=Gewicht, bw=Körpergewicht, t=Zeit), Gruppe
 ['squat','Kniebeuge','Back Squat','w','Beine'],
 ['frontsquat','Frontkniebeuge','Front Squat','w','Beine'],
 ['legpress','Beinpresse','Leg Press','w','Beine'],
 ['rdl','Rumänisches Kreuzheben','Romanian Deadlift','w','Beine'],
 ['lunge','Ausfallschritte','Lunges','w','Beine'],
 ['legcurl','Beinbeuger','Leg Curl','w','Beine'],
 ['calf','Wadenheben','Calf Raise','w','Beine'],
 ['deadlift','Kreuzheben','Deadlift','w','Rücken'],
 ['row','Langhantelrudern','Barbell Row','w','Rücken'],
 ['dbrow','Kurzhantelrudern','Dumbbell Row','w','Rücken'],
 ['latpull','Latzug','Lat Pulldown','w','Rücken'],
 ['pullup','Klimmzüge','Pull-ups','bw','Rücken'],
 ['bench','Bankdrücken','Bench Press','w','Brust'],
 ['incline','Schrägbankdrücken','Incline Press','w','Brust'],
 ['dbbench','Kurzhantel-Bankdrücken','Dumbbell Bench','w','Brust'],
 ['pushup','Liegestütze','Push-ups','bw','Brust'],
 ['dip','Dips','Dips','bw','Brust'],
 ['ohp','Schulterdrücken','Overhead Press','w','Schultern'],
 ['latraise','Seitheben','Lateral Raise','w','Schultern'],
 ['facepull','Face Pulls','Face Pulls','w','Schultern'],
 ['curl','Bizepscurls','Biceps Curl','w','Arme'],
 ['triceps','Trizepsdrücken','Triceps Extension','w','Arme'],
 ['plank','Unterarmstütz','Plank','t','Rumpf'],
 ['hang','Hängen an der Stange','Dead Hang','t','Rumpf'],
 ['situp','Crunches','Crunches','bw','Rumpf'],
 ['legraise','Beinheben','Leg Raise','bw','Rumpf'],
];
const CHECKIN=[
 {k:'mood',    q:'Wie geht es dir heute?',  l:'Stimmung',    e:['😫','😕','😐','🙂','😄']},
 {k:'energy',  q:'Wie fit fühlst du dich?', l:'Energie',     e:['🪫','😮‍💨','😐','💪','⚡']},
 {k:'sleep',   q:'Wie hast du geschlafen?', l:'Schlaf',      e:['🥱','😪','😐','😌','😴']},
 {k:'soreness',q:'Muskelkater / Schmerzen?',l:'Körpergefühl',e:['🤕','😣','😐','🙂','🦾'],
   hint:['Tut richtig weh','Deutlicher Kater','Etwas zu spüren','Fast nichts','Alles locker']},
];
const MOOD_HINT=['Mies','Nicht so gut','Okay','Gut','Super'];
const RPE_INFO={5:['Locker','5+ übrig'],6:['Leicht','4 übrig'],7:['Mittel','3 übrig'],8:['Hart','2 übrig'],9:['Sehr hart','1 übrig'],10:['Maximum','0 übrig']};
const RPE_SHORT={5:'Locker',6:'Leicht',7:'Mittel',8:'Hart',9:'Sehr hart',10:'Max'};
const RPE_COLORS={5:'#5fcf8c',6:'#8fd16a',7:'#d9c24a',8:'#f0a33a',9:'#f0602a',10:'#e35353'};

let S=load();
function blank(){return {version:1,exercises:DEFAULT_EXERCISES.map(e=>({id:e[0],name:e[1],en:e[2],type:e[3],group:e[4]})),workouts:[],active:null,settings:{rest:90,step:1.25,name:'',demo:false,welcomed:false,sound:true,soundId:'beep',awake:true}};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);return Object.assign(blank(),s,{settings:Object.assign(blank().settings,s.settings||{})});}}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Speichern nicht möglich (Browser-Speicher blockiert)');}}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const ex=id=>S.exercises.find(e=>e.id===id)||{name:'Unbekannt',type:'w'};
const fmtKg=v=>(Math.round(v*100)/100).toLocaleString('de-DE')+' kg';
const fmtN=v=>Math.round(v).toLocaleString('de-DE');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDate=s=>{const d=new Date(s+'T12:00:00');return d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});};
const fmtDateLong=s=>new Date(s+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e1rm=(w,r)=>r>=1?w*(1+r/30):0;   // Epley
const rir=rpe=>rpe>=10?0:Math.max(0,10-rpe);
const setVolume=(s,type)=>type==='t'?0:(s.w||0)*(s.reps||0);
function workoutVolume(w){return w.entries.reduce((a,en)=>a+en.sets.reduce((b,s)=>b+setVolume(s,ex(en.exId).type),0),0);}
function workoutSets(w){return w.entries.reduce((a,en)=>a+en.sets.length,0);}
function avgRpe(w){const r=w.entries.flatMap(en=>en.sets.map(s=>s.rpe)).filter(Boolean);return r.length?r.reduce((a,b)=>a+b,0)/r.length:null;}
function moodScore(c){if(!c)return null;const v=['mood','energy','sleep','soreness'].map(k=>c[k]).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function durationMin(w){return w.start&&w.end?Math.max(1,Math.round((w.end-w.start)/60000)):null;}
const sortedWorkouts=()=>[...S.workouts].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.start||0)-(b.start||0));

/* Bestwerte pro Übung (vor einem Datum) */
function bestFor(exId,beforeDate,excludeId){
  let best={e1rm:0,w:0,reps:0,secs:0};
  for(const w of S.workouts){
    if(w.id===excludeId)continue; if(beforeDate&&w.date>beforeDate)continue;
    for(const en of w.entries){ if(en.exId!==exId)continue;
      for(const s of en.sets){
        const t=ex(exId).type;
        if(t==='t'){best.secs=Math.max(best.secs,s.secs||0);}
        else{const wt=t==='bw'?(s.w||0):(s.w||0);const e=t==='bw'?(s.reps||0)*1000+(s.w||0):e1rm(wt,s.reps||0);
          if(e>best.e1rm){best.e1rm=e;best.w=wt;best.reps=s.reps||0;}}
      }}
  }
  return best;
}
function isPR(exId,set,workout){
  const t=ex(exId).type; const b=bestFor(exId,null,workout.id);
  if(t==='t')return (set.secs||0)>b.secs&&b.secs>0;
  if(t==='bw')return ((set.reps||0)*1000+(set.w||0))>b.e1rm&&b.e1rm>0;
  return e1rm(set.w||0,set.reps||0)>b.e1rm&&b.e1rm>0;
}
function lastSetsFor(exId,excludeId){
  const ws=sortedWorkouts().filter(w=>w.id!==excludeId&&w.entries.some(en=>en.exId===exId));
  if(!ws.length)return null; const w=ws[ws.length-1];
  return {date:w.date,sets:w.entries.find(en=>en.exId===exId).sets};
}

/* ========= Training ========= */
function renderTrain(){
  if(!S.settings.welcomed&&!S.workouts.length&&!S.active){return renderWelcome();}
  if(S.active)return renderActive();
  const last=sortedWorkouts().slice(-1)[0];
  const draft=S.draft||{};
  main.innerHTML=`
   ${S.settings.demo?demoBanner():''}
   <section class="card checkin">
     <div class="row between" style="margin-bottom:6px"><h2>Check-in</h2><span class="small muted">${fmtDate(todayStr())}</span></div>
     ${CHECKIN.map(c=>`<div class="q"><div class="lbl"><b>${c.q}</b><span class="small muted" id="hint-${c.k}">${draft[c.k]?(c.hint||MOOD_HINT)[draft[c.k]-1]:''}</span></div>
       <div class="emos" role="radiogroup" aria-label="${c.l}">${c.e.map((em,i)=>`<button class="emo ${draft[c.k]===i+1?'on':''}" data-k="${c.k}" data-v="${i+1}" aria-label="${(c.hint||MOOD_HINT)[i]}" aria-pressed="${draft[c.k]===i+1}">${em}</button>`).join('')}</div></div>`).join('')}
   </section>
   <button class="btn primary block" id="start">Training starten</button>
   ${last?`<section class="card"><div class="eyebrow">Letztes Training</div><div class="row between" style="margin-top:4px"><h3>${fmtDate(last.date)}</h3><span class="small muted num">${workoutSets(last)} Sätze · ${fmtKg(workoutVolume(last))}</span></div>
     <div class="small muted" style="margin-top:6px">${last.entries.map(en=>esc(ex(en.exId).name)).join(' · ')}</div></section>`:''}
   <section class="card flat small muted" style="padding:0 4px">Tipp: Beim RPE zählt, wie viele Wiederholungen du <b>noch</b> geschafft hättest. RPE 8 heißt: zwei wären noch drin gewesen. Für die meisten Sätze ist RPE 7–8 genau richtig.</section>`;
  main.querySelectorAll('.emo').forEach(b=>b.addEventListener('click',()=>{S.draft=S.draft||{};S.draft[b.dataset.k]=+b.dataset.v;save();renderTrain();}));
  $('#start').addEventListener('click',()=>{
    S.active={id:uid(),date:todayStr(),start:Date.now(),end:null,checkin:Object.assign({},S.draft||{}),note:'',entries:[]};
    S.draft=null;save();unlockAudio();keepAwake();renderActive();
    if(!S.active.entries.length)pickExercise();
  });
}
function demoBanner(){return `<div class="demo-banner"><span>Du siehst <b>Beispieldaten</b> zum Ausprobieren.</span><button class="btn sm ghost" onclick="clearDemo()">Löschen</button></div>`;}
function clearDemo(){S=blank();S.settings.welcomed=true;save();toast('Beispieldaten entfernt');render();}
function renderWelcome(){
  main.innerHTML=`<section class="card hero"><div class="eyebrow">Willkommen</div><h2 style="font-size:28px;margin:6px 0 10px">Dein Trainingstagebuch</h2>
   <p class="muted" style="margin:0 0 16px">Gewicht, Wiederholungen und Anstrengung pro Satz. Dazu ein kurzer Smiley-Check-in, wie es dir heute geht. Alles bleibt auf deinem Handy.</p>
   <div class="stack"><button class="btn primary block" id="w-demo">Mit Beispieldaten ausprobieren</button><button class="btn block" id="w-empty">Leer starten</button></div></section>
   <section class="card"><h3>So funktioniert's</h3><ol class="muted" style="padding-left:20px;margin:8px 0 0;line-height:1.6"><li>Check-in mit Smileys (10 Sekunden)</li><li>Training starten, Übung wählen</li><li>Pro Satz Gewicht, Wiederholungen und RPE eintragen</li><li>Fertig – die Statistik füllt sich von selbst</li></ol></section>
   <section class="card"><h3>Aufs iPhone als App</h3><p class="muted small" style="margin:6px 0 0">In Safari unten auf <b>Teilen</b> tippen, dann <b>„Zum Home-Bildschirm"</b>. Danach öffnet sich Eisenbuch wie eine App.</p></section>`;
  $('#w-demo').addEventListener('click',()=>{loadDemo();S.settings.welcomed=true;save();render();});
  $('#w-empty').addEventListener('click',()=>{S.settings.welcomed=true;save();render();});
}
function renderActive(){
  const w=S.active; const vol=workoutVolume(w), sets=workoutSets(w);
  main.innerHTML=`
   <section class="card hero"><div class="row between"><div><div class="eyebrow">${w._reopened?'Training bearbeiten':'Training läuft'}</div><div class="dur num" id="dur" style="${w._reopened?'font-size:26px':''}">${w._reopened?fmtDate(w.date):elapsed(w.start)}</div></div>
     <button class="emoline" id="ci-edit" style="font-size:22px" aria-label="Check-in ändern">${checkinEmojis(w.checkin)||'<span class="small muted">Check-in</span>'}</button></div>
     <div class="kpis"><div><b class="num">${w.entries.length}</b><span>Übungen</span></div><div><b class="num">${sets}</b><span>Sätze</span></div><div><b class="num">${fmtN(vol)}</b><span>kg bewegt</span></div></div></section>
   ${w.entries.map((en,i)=>exerciseBlock(en,i,w)).join('')}
   <button class="btn block" id="addex">+ Übung hinzufügen</button>
   <section class="card"><div class="field"><label for="note">Notiz zum Training</label><textarea class="input" id="note" placeholder="z. B. Schulter hat beim Drücken gezwickt">${esc(w.note)}</textarea></div></section>
   <div class="grid2"><button class="btn ghost danger" id="abort">Abbrechen</button><button class="btn primary" id="finish" ${sets?'':'disabled'}>Beenden</button></div>`;
  $('#addex').addEventListener('click',pickExercise);
  $('#note').addEventListener('input',e=>{w.note=e.target.value;save();});
  $('#abort').addEventListener('click',()=>confirmSheet('Training abbrechen?','Alle Sätze dieses Trainings werden verworfen.','Verwerfen',()=>{S.active=null;stopRest();releaseWake();save();render();}));
  $('#finish').addEventListener('click',finishWorkout);
  $('#ci-edit').addEventListener('click',()=>checkinSheet(w));
  main.querySelectorAll('[data-addset]').forEach(b=>b.addEventListener('click',()=>editSet(+b.dataset.addset,null)));
  main.querySelectorAll('[data-editset]').forEach(b=>b.addEventListener('click',()=>{const [i,j]=b.dataset.editset.split(',').map(Number);editSet(i,j);}));
  main.querySelectorAll('[data-removeex]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.removeex;confirmSheet('Übung entfernen?',ex(w.entries[i].exId).name+' aus diesem Training entfernen.','Entfernen',()=>{w.entries.splice(i,1);save();renderActive();});}));
  tickDuration(); if(!restTimer)resumeRest(); if(!wakeLock)keepAwake();
}
let durT=null;
function tickDuration(){clearInterval(durT);durT=setInterval(()=>{const d=$('#dur');if(!d||!S.active||S.active._reopened){clearInterval(durT);return;}d.textContent=elapsed(S.active.start);},10000);}
function checkinSheet(w){w.checkin=w.checkin||{};
  const body=()=>CHECKIN.map(c=>`<div class="q"><div class="lbl"><b>${c.q}</b><span class="small muted">${w.checkin[c.k]?(c.hint||MOOD_HINT)[w.checkin[c.k]-1]:''}</span></div><div class="emos">${c.e.map((em,i)=>`<button class="emo ${w.checkin[c.k]===i+1?'on':''}" data-k="${c.k}" data-v="${i+1}" aria-label="${(c.hint||MOOD_HINT)[i]}">${em}</button>`).join('')}</div></div>`).join('');
  sheet(`<h2>Check-in</h2><div class="checkin" id="ci-body">${body()}</div><button class="btn primary block" id="ok">Fertig</button>`,root=>{
    const wire=()=>root.querySelectorAll('.emo').forEach(b=>b.addEventListener('click',()=>{w.checkin[b.dataset.k]=+b.dataset.v;save();root.querySelector('#ci-body').innerHTML=body();wire();}));wire();
    root.querySelector('#ok').addEventListener('click',()=>{closeSheet();renderActive();});});}
function elapsed(start){const m=Math.floor((Date.now()-start)/60000);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');}
function checkinEmojis(c){if(!c)return '';return CHECKIN.map(q=>c[q.k]?q.e[c[q.k]-1]:'').join('');}
function exerciseBlock(en,i,w){
  const e=ex(en.exId); const last=lastSetsFor(en.exId,w.id);
  return `<section class="card ex"><div class="exhead"><h3>${esc(e.name)}</h3><button class="small muted" data-removeex="${i}" aria-label="Übung entfernen">✕</button></div>
   ${last?`<div class="last">Letztes Mal (${fmtDate(last.date)}): <b>${setsSummary(last.sets,e.type)}</b></div>`:'<div class="last">Erstes Mal – finde ein Gewicht, bei dem du noch 2–3 Wiederholungen übrig hättest.</div>'}
   <div class="sets">${en.sets.map((s,j)=>`<button class="set done" data-editset="${i},${j}"><span class="n num">${j+1}</span><span class="vals">${setVals(s,e.type)}${isPR(en.exId,s,w)?'<span class="pr">PR</span>':''}</span>${s.rpe?`<span class="rpe-pill num" style="background:${RPE_COLORS[s.rpe]}">${s.rpe}</span>`:'<span class="edit">–</span>'}</button>`).join('')}</div>
   <div class="exfoot"><button class="btn block" data-addset="${i}">+ Satz ${en.sets.length+1}</button></div></section>`;
}
function setVals(s,type){
  if(type==='t')return `<span class="v num">${s.secs}<small>s</small></span>`;
  if(type==='bw')return `<span class="v num">${s.reps}<small>Wdh</small></span>${s.w?`<span class="v num">+${fmtKg(s.w)}</span>`:''}`;
  return `<span class="v num">${(s.w||0).toLocaleString('de-DE')}<small>kg</small></span><span class="v num">${s.reps}<small>Wdh</small></span>`;
}
function setsSummary(sets,type){
  if(type==='t')return sets.map(s=>s.secs+' s').join(', ');
  if(type==='bw'){const ws=[...new Set(sets.map(s=>s.w||0))];return sets.map(s=>s.reps).join(', ')+' Wdh'+(ws.some(x=>x)?' (+'+ws.map(x=>x.toLocaleString('de-DE')).join('/')+' kg)':'');}
  const ws=[...new Set(sets.map(s=>s.w))];return (ws.length===1?fmtKg(ws[0])+' × ':'')+sets.map(s=>ws.length===1?s.reps:(s.w.toLocaleString('de-DE')+'×'+s.reps)).join(', ')+(ws.length===1?'':' kg')+(sets.some(s=>s.rpe)?' · RPE '+Math.round(sets.filter(s=>s.rpe).reduce((a,s)=>a+s.rpe,0)/sets.filter(s=>s.rpe).length*10)/10:'');
}
function pickExercise(){
  const groups=[...new Set(S.exercises.map(e=>e.group))];
  const recent=[...new Set(sortedWorkouts().slice(-6).flatMap(w=>w.entries.map(en=>en.exId)))].filter(id=>S.exercises.some(e=>e.id===id)).slice(0,6);
  const list=q=>{q=(q||'').toLowerCase();const match=e=>!q||e.name.toLowerCase().includes(q)||(e.en||'').toLowerCase().includes(q);
    let h='';
    if(!q&&recent.length)h+=`<div class="grp">Zuletzt</div>`+recent.map(id=>item(ex(id))).join('');
    for(const g of groups){const es=S.exercises.filter(e=>e.group===g&&match(e));if(!es.length)continue;h+=`<div class="grp">${esc(g)}</div>`+es.map(item).join('');}
    if(!h)h=`<div class="empty">Nichts gefunden.<br><button class="btn sm" style="margin-top:10px" id="newex">„${esc(q)}" als neue Übung anlegen</button></div>`;
    return h;};
  const item=e=>`<button data-pick="${e.id}"><span>${esc(e.name)} <span class="en">${e.en&&e.en!==e.name?esc(e.en):''}</span></span><span class="tag">${{w:'kg',bw:'Körpergewicht',t:'Zeit'}[e.type]}</span></button>`;
  sheet(`<h2>Übung wählen</h2><input class="search" id="q" placeholder="Suchen …" autocomplete="off"><div class="plist" id="plist">${list('')}</div>`,root=>{
    const q=root.querySelector('#q'),pl=root.querySelector('#plist');
    const wire=()=>{pl.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{addExercise(b.dataset.pick);}));const n=pl.querySelector('#newex');if(n)n.addEventListener('click',()=>{closeSheet();newExerciseSheet(q.value.trim(),id=>addExercise(id));});};
    q.addEventListener('input',()=>{pl.innerHTML=list(q.value);wire();});wire();
  });
}
function addExercise(id){const w=S.active;if(!w)return;let i=w.entries.findIndex(en=>en.exId===id);if(i<0){w.entries.push({exId:id,sets:[]});i=w.entries.length-1;}save();closeSheet();renderActive();editSet(i,null);setTimeout(()=>{const el=main.querySelectorAll('.ex')[i];if(el)el.scrollIntoView({block:'center'});},50);}
function editSet(i,j){
  const w=S.active; const en=w.entries[i]; const e=ex(en.exId); const step=S.settings.step||1.25;
  const prev=j!=null?en.sets[j]:(en.sets[en.sets.length-1]||(lastSetsFor(en.exId,w.id)||{sets:[{}]}).sets[0]||{});
  const s=j!=null?{...en.sets[j]}:{w:prev.w??(e.type==='w'?20:0),reps:prev.reps??(e.type==='t'?0:8),secs:prev.secs??30,rpe:null};
  const title=`${esc(e.name)} · Satz ${j!=null?j+1:en.sets.length+1}`;
  const weightBlock=e.type==='t'?'':`<div><div class="stepper"><button class="stepbtn" data-d="-5">−5</button><button class="stepbtn" data-d="${-step}">−${step.toLocaleString('de-DE')}</button><input class="bigval num" id="wv" type="number" inputmode="decimal" step="0.25" min="0" value="${s.w}"><button class="stepbtn" data-d="${step}">+${step.toLocaleString('de-DE')}</button><button class="stepbtn" data-d="5">+5</button></div><div class="unitlbl">${e.type==='bw'?'Zusatzgewicht kg (0 = ohne)':'Gewicht kg'}</div></div>`;
  const repsBlock=e.type==='t'?`<div><div class="stepper"><button class="stepbtn" data-s="-5">−5</button><button class="stepbtn" data-s="-1">−1</button><input class="bigval num" id="sv" type="number" inputmode="numeric" min="0" value="${s.secs}"><button class="stepbtn" data-s="1">+1</button><button class="stepbtn" data-s="5">+5</button></div><div class="unitlbl">Sekunden</div></div>`
    :`<div><div class="stepper narrow"><button class="stepbtn" data-r="-1">−1</button><input class="bigval num" id="rv" type="number" inputmode="numeric" min="0" value="${s.reps}"><button class="stepbtn" data-r="1">+1</button></div><div class="unitlbl">Wiederholungen</div></div>`;
  sheet(`<div class="row between"><h2>${title}</h2>${j!=null?'<button class="btn sm ghost danger" id="del">Löschen</button>':''}</div>
   ${weightBlock}${repsBlock}
   <div><div class="eyebrow" style="margin-bottom:6px">Wie hart war der Satz? (RPE)</div><div class="rpescale">${[5,6,7,8,9,10].map(r=>`<button class="chip ${s.rpe===r?'on':''}" data-rpe="${r}" style="${s.rpe===r?'background:'+RPE_COLORS[r]:''}">${r}<small>${RPE_SHORT[r]}</small></button>`).join('')}</div>
   <div class="rpeinfo" id="rpeinfo" style="margin-top:8px">${rpeInfoHtml(s.rpe)}</div></div>
   <button class="btn primary block" id="ok">${j!=null?'Speichern':'Satz eintragen'}</button>`,root=>{
    const wv=root.querySelector('#wv'),rv=root.querySelector('#rv'),sv=root.querySelector('#sv');
    const clamp=(v,min)=>Math.max(min,Math.round(v*100)/100);
    root.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{wv.value=clamp((+wv.value||0)+ +b.dataset.d,0);}));
    root.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{rv.value=clamp((+rv.value||0)+ +b.dataset.r,0);}));
    root.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{sv.value=clamp((+sv.value||0)+ +b.dataset.s,0);}));
    root.querySelectorAll('[data-rpe]').forEach(b=>b.addEventListener('click',()=>{s.rpe=s.rpe===+b.dataset.rpe?null:+b.dataset.rpe;root.querySelectorAll('[data-rpe]').forEach(c=>{const on=+c.dataset.rpe===s.rpe;c.classList.toggle('on',on);c.style.background=on?RPE_COLORS[s.rpe]:'';});root.querySelector('#rpeinfo').innerHTML=rpeInfoHtml(s.rpe);}));
    root.querySelector('#ok').addEventListener('click',()=>{
      if(wv)s.w=Math.max(0,+String(wv.value).replace(',','.')||0); if(rv)s.reps=Math.max(0,Math.round(+rv.value||0)); if(sv)s.secs=Math.max(0,Math.round(+sv.value||0));
      if(e.type!=='t'&&!s.reps){toast('Wie viele Wiederholungen?');return;} if(e.type==='t'&&!s.secs){toast('Wie viele Sekunden?');return;}
      const wasNew=j==null; if(wasNew)en.sets.push(s);else en.sets[j]=s;
      save();closeSheet();renderActive();
      if(wasNew){if(isPR(en.exId,s,w))toast('🔥 Neuer persönlicher Rekord!');startRest();}else{unlockAudio();}
    });
    const del=root.querySelector('#del');if(del)del.addEventListener('click',()=>{en.sets.splice(j,1);save();closeSheet();renderActive();});
  });
}
function rpeInfoHtml(r){if(!r)return `<span class="muted">Noch keine Angabe. Faustregel: Wie viele Wiederholungen hättest du noch geschafft?</span>`;return `<span>${RPE_INFO[r][0]}</span><span><b class="num" style="color:${RPE_COLORS[r]}">${rir(r)}</b> <span class="muted">Wdh. übrig (RIR)</span></span>`;}
function confirmSheet(title,text,okLabel,onOk,danger=true){sheet(`<h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(text)}</p><div class="grid2"><button class="btn" id="c-no">Zurück</button><button class="btn ${danger?'danger':'primary'}" id="c-ok">${esc(okLabel)}</button></div>`,root=>{root.querySelector('#c-no').addEventListener('click',closeSheet);root.querySelector('#c-ok').addEventListener('click',()=>{closeSheet();onOk();});});}
function finishWorkout(){
  const w=S.active; if(!w._reopened)w.end=Date.now(); delete w._reopened; w.entries=w.entries.filter(en=>en.sets.length);
  const prs=w.entries.flatMap(en=>en.sets.filter(s=>isPR(en.exId,s,w)).map(()=>ex(en.exId).name));
  S.workouts.push(w); S.active=null; stopRest(); releaseWake(); save();
  sheet(`<div class="eyebrow">Training beendet</div><h2 style="font-size:28px">Stark, ${S.settings.name||'gut gemacht'}! 💪</h2>
   <div class="tiles"><div class="tile"><div class="v num">${durationMin(w)}</div><div class="l">Minuten</div></div><div class="tile"><div class="v num">${workoutSets(w)}</div><div class="l">Sätze</div></div><div class="tile"><div class="v num">${fmtN(workoutVolume(w))}</div><div class="l">kg bewegt</div></div></div>
   ${prs.length?`<div class="insight">🔥 Neue Rekorde: ${[...new Set(prs)].map(esc).join(', ')}</div>`:''}
   ${avgRpe(w)?`<p class="muted small" style="margin:0">Durchschnittliches RPE: <b class="num">${avgRpe(w).toFixed(1)}</b>${avgRpe(w)>9?' – ganz schön am Limit. Technik vor Gewicht!':avgRpe(w)<6.5?' – da wäre noch Luft gewesen.':' – gut dosiert.'}</p>`:''}
   <button class="btn primary block" id="ok">Fertig</button>`,root=>root.querySelector('#ok').addEventListener('click',()=>{closeSheet();tab='history';render();}));
}
/* Pausen-Timer – rechnet mit einem Endzeitpunkt, damit er nach Sperren/Minimieren korrekt weiterläuft */
let restEnd=null, restTotal=0, restBeeped=false;
function startRest(){stopRest();const total=S.settings.rest||90;if(!total)return;restTotal=total;restEnd=Date.now()+total*1000;restBeeped=false;if(S.active){S.active.restEnd=restEnd;S.active.restTotal=total;save();}
  unlockAudio();keepAwake();drawRest();restTimer=setInterval(tickRest,500);}
function resumeRest(){ // nach Neustart der App: laufenden Timer wiederherstellen
  if(S.active&&S.active.restEnd&&Date.now()-S.active.restEnd<120000){restEnd=S.active.restEnd;restTotal=S.active.restTotal||S.settings.rest||90;restBeeped=restEnd<=Date.now();drawRest();restTimer=setInterval(tickRest,500);}}
function tickRest(){if(!restEnd)return;const left=Math.round((restEnd-Date.now())/1000);
  if(left<=0&&!restBeeped){restBeeped=true;playBeep();}
  if(left<-120)return stopRest();drawRest();}
function drawRest(){const el=$('#rest');if(!el||!restEnd)return;const left=Math.round((restEnd-Date.now())/1000);el.hidden=false;document.body.classList.add('resting');el.classList.toggle('over',left<=0);
  el.innerHTML=`<div class="t num">${left>=0?fmtMMSS(left):'+'+fmtMMSS(-left)}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,left/restTotal*100))}%"></i></div><button class="btn sm" id="rest-add">+30</button><button class="btn sm ghost" id="rest-x" aria-label="Timer schließen">✕</button>`;
  el.querySelector('#rest-add').addEventListener('click',()=>{restEnd+=30000;restBeeped=false;if(S.active){S.active.restEnd=restEnd;save();}drawRest();});el.querySelector('#rest-x').addEventListener('click',stopRest);}
function stopRest(){clearInterval(restTimer);restTimer=null;restEnd=null;if(S.active&&S.active.restEnd){delete S.active.restEnd;save();}const el=$('#rest');if(el)el.hidden=true;document.body.classList.remove('resting');}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(restEnd)tickRest();if(S.active)keepAwake();const d=$('#dur');if(d&&S.active&&!S.active._reopened)d.textContent=elapsed(S.active.start);}});

/* Ton: Web Audio, beim Antippen freigeschaltet (iOS verlangt eine Berührung, bevor eine Seite Töne spielen darf) */
let actx=null;
function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  if(navigator.audioSession&&navigator.audioSession.type!=='transient')navigator.audioSession.type='transient';}catch(e){}}
const SOUNDS=[
 {id:'beep',   name:'Piepser',       desc:'Drei kurze Töne, ein hoher Abschluss'},
 {id:'bell',   name:'Ringglocke',    desc:'Wie am Boxring'},
 {id:'ding',   name:'Ding',          desc:'Heller Einzelton, dreimal'},
 {id:'buzzer', name:'Buzzer',        desc:'Tiefer Summer wie in der Halle'},
 {id:'whistle',name:'Trillerpfeife', desc:'Kurz und durchdringend'},
 {id:'arcade', name:'Arcade',        desc:'Aufsteigende Tonfolge'},
 {id:'siren',  name:'Sirene',        desc:'Zwei Wechseltöne'},
];
function tone(t0,{f,at=0,dur=.2,type='sine',vol=.25,f2=null,decay=false}){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t0+at);if(f2!=null)o.frequency.exponentialRampToValueAtTime(f2,t0+at+dur);
  g.gain.setValueAtTime(0,t0+at);g.gain.linearRampToValueAtTime(vol,t0+at+.01);if(decay)g.gain.exponentialRampToValueAtTime(.001,t0+at+dur);else{g.gain.setValueAtTime(vol,t0+at+dur-.03);g.gain.linearRampToValueAtTime(0,t0+at+dur);}
  o.connect(g).connect(actx.destination);o.start(t0+at);o.stop(t0+at+dur+.05);}
function playSound(id){try{unlockAudio();if(!actx)return;const t0=actx.currentTime;
  switch(id){
    case 'bell': for(const at of [0,.7]){tone(t0,{f:1046,at,dur:1.1,vol:.3,decay:true});tone(t0,{f:1046*2.76,at,dur:.5,vol:.12,decay:true});tone(t0,{f:1046*5.4,at,dur:.25,vol:.06,decay:true});} break;
    case 'ding': for(const at of [0,.35,.7])tone(t0,{f:1760,at,dur:.5,vol:.3,decay:true}); break;
    case 'buzzer': tone(t0,{f:140,dur:.7,type:'sawtooth',vol:.22});tone(t0,{f:141.5,dur:.7,type:'square',vol:.08}); break;
    case 'whistle': for(const at of [0,.3]){tone(t0,{f:2600,at,dur:.22,vol:.22});tone(t0,{f:2635,at,dur:.22,vol:.1});} break;
    case 'arcade': [523,659,784,1047].forEach((f,i)=>tone(t0,{f,at:i*.11,dur:.1,type:'square',vol:.18}));tone(t0,{f:1319,at:.46,dur:.4,type:'square',vol:.2,decay:true}); break;
    case 'siren': [0,.4,.8].forEach(at=>{tone(t0,{f:700,at,dur:.2,type:'triangle',vol:.3});tone(t0,{f:1000,at:at+.2,dur:.2,type:'triangle',vol:.3});}); break;
    default: [[880,0,.12],[880,.18,.12],[880,.36,.12],[1175,.6,.35]].forEach(([f,at,dur])=>tone(t0,{f,at,dur,type:'square',vol:.25}));
  }}catch(e){}}
function playBeep(){if(S.settings.sound===false)return;if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]);playSound(S.settings.soundId||'beep');}

async function keepAwake(){if(S.settings.awake===false||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;try{if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){}}

function drawExChart(){

    else pts.push({d:w.date,a:Math.max(...en.sets.map(s=>s.w||0)),b:Math.round(Math.max(...en.sets.map(s=>e1rm(s.w||0,s.reps||0))))});}
  const cfg=e.type==='t'?{series:[{k:'a',name:'Längste Zeit (s)',c:'var(--s1)'}],unit:'s'}

    :{series:[{k:'a',name:'Schwerstes Gewicht',c:'var(--s1)'},{k:'b',name:'Geschätztes Maximum (e1RM)',c:'var(--s2)'}],unit:' kg'};

function lineChart(pts,cfg){
  const W=Math.max(280,main.clientWidth-32-32),H=200,pl=38,pr=12,pt=14,pb=28;
  const xs=pts.map((p,i)=>i), allY=pts.flatMap(p=>cfg.series.map(s=>p[s.k]).filter(v=>v!=null));
  let yMin=Math.min(...allY),yMax=Math.max(...allY); if(yMin===yMax){yMin-=1;yMax+=1;} const pad=(yMax-yMin)*.15;yMin=Math.max(0,yMin-pad);yMax+=pad;
  const nice=niceTicks(yMin,yMax,4); yMin=nice[0];yMax=nice[nice.length-1];
  const X=i=>pl+(pts.length===1?0:(i/(pts.length-1))*(W-pl-pr)), Y=v=>pt+(1-(v-yMin)/(yMax-yMin))*(H-pt-pb);
  let g=nice.map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" class="num">${fmtN(t)}</text>`).join('');
  const step=Math.ceil(pts.length/5); const idx=new Set(); for(let i=0;i<pts.length;i+=step)idx.add(i); const lastReg=Math.floor((pts.length-1)/step)*step; if(lastReg!==pts.length-1&&pts.length-1-lastReg<step*0.6)idx.delete(lastReg); idx.add(pts.length-1);
  const labels=[...idx].map(i=>`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${shortDate(pts[i].d)}</text>`).join('');
  const lines=cfg.series.map(s=>{const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[s.k]).toFixed(1)).join(' ');
    return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`+pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[s.k])}" r="${i===pts.length-1?5:3.5}" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`).join('');}).join('');
  const last=pts[pts.length-1];
  const endLabels=cfg.series.map((s,k)=>`<text x="${X(pts.length-1)-8}" y="${Y(last[s.k])+(k?-8:14)}" text-anchor="end" style="fill:var(--fg);font-weight:600" class="num">${fmtN(last[s.k])}${cfg.unit}</text>`).join('');
  const hits=pts.map((p,i)=>`<rect x="${X(i)-(W-pl-pr)/pts.length/2}" y="${pt}" width="${(W-pl-pr)/pts.length}" height="${H-pt-pb}" fill="transparent" data-tip="${esc(fmtDate(p.d)+': '+cfg.series.map(s=>s.name.split(' (')[0]+' '+fmtN(p[s.k])+cfg.unit).join(' · '))}" data-x="${X(i)}" data-y="${Y(p[cfg.series[0].k])}"/>`).join('');
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">${g}${labels}${lines}${endLabels}${hits}</svg></div>`;
}
function niceTicks(min,max,n){const range=max-min||1;const raw=range/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const r=raw/mag;const stp=(r<1.5?1:r<3?2:r<7?5:10)*mag;const lo=Math.floor(min/stp)*stp,hi=Math.ceil(max/stp)*stp;const t=[];for(let v=lo;v<=hi+1e-9;v+=stp)t.push(Math.round(v*1000)/1000);return t;}
const shortDate=s=>{const d=new Date(s+'T12:00:00');return d.getDate()+'.'+(d.getMonth()+1)+'.';};
function drawVolChart(){
  const ws=sortedWorkouts(); const weeks=[]; const now=new Date(todayStr()+'T12:00:00'); const day=(now.getDay()+6)%7; const mon=new Date(now);mon.setDate(now.getDate()-day);
  for(let i=11;i>=0;i--){const s=new Date(mon);s.setDate(mon.getDate()-7*i);const e=new Date(s);e.setDate(s.getDate()+6);const a=s.toISOString().slice(0,10),b=e.toISOString().slice(0,10);const inW=ws.filter(w=>w.date>=a&&w.date<=b);weeks.push({a,b,vol:inW.reduce((x,w)=>x+workoutVolume(w),0),n:inW.length});}
  const W=Math.max(280,main.clientWidth-32-32),H=170,pl=44,pr=8,pt=12,pb=26; const max=Math.max(1,...weeks.map(w=>w.vol)); const ticks=niceTicks(0,max*1.1,3); const top=ticks[ticks.length-1];

  let g=ticks.map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" class="num">${t>=1000?(t/1000).toLocaleString('de-DE')+'t':fmtN(t)}</text>`).join('');

    return `<rect x="${x}" y="${Y(w.vol)}" width="${wd}" height="${h}" rx="3" fill="${cur?'var(--s1)':'var(--s2)'}" data-tip="${esc('KW '+isoWeek(w.a)+': '+fmtKg(w.vol)+' · '+w.n+' Training'+(w.n===1?'':'s'))}" data-x="${x+wd/2}" data-y="${Y(w.vol)}"/>`+((i%3===2||i===11)?`<text x="${x+wd/2}" y="${H-8}" text-anchor="middle">${cur?'jetzt':'KW '+isoWeek(w.a)}</text>`:'');}).join('');

  attachTooltips($('#volchart'));

function isoWeek(s){const d=new Date(s+'T12:00:00');d.setHours(0,0,0,0);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7);}

  g+=['😫','😕','😐','🙂','😄'].map((e,i)=>`<text x="${X(i+1)}" y="${H-6}" text-anchor="middle" style="font-size:16px">${e}</text>`).join('');
  g+=`<text x="${pl-6}" y="${pt-2}" text-anchor="end" style="font-size:10px">RPE</text>`;
  const dots=pts.map((p,i)=>`<circle cx="${X(p.x)+((i%3)-1)*3}" cy="${Y(p.y)}" r="7" fill="var(--s1)" fill-opacity=".75" stroke="var(--surface)" stroke-width="2" data-tip="${esc(fmtDate(p.d)+': Tagesform '+p.x.toFixed(1)+'/5 · Ø RPE '+p.y.toFixed(1))}" data-x="${X(p.x)}" data-y="${Y(p.y)}"/>`).join('');
  box.innerHTML=`<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tagesform gegen RPE">${g}${dots}</svg></div>`;
  attachTooltips(box);
  const good=pts.filter(p=>p.x>=3.5),bad=pts.filter(p=>p.x<3);
  if(good.length>=2&&bad.length>=2){const avg=a=>a.reduce((s,p)=>s+p.y,0)/a.length;const diff=avg(bad)-avg(good);
    ins.innerHTML=`<div class="insight">${Math.abs(diff)<0.3?'Deine Tagesform hat bisher kaum Einfluss darauf, wie hart sich das Training anfühlt.':diff>0?`An guten Tagen fühlt sich dein Training im Schnitt <b class="num">${diff.toFixed(1)} RPE-Punkte leichter</b> an als an schlechten. Schlaf und Erholung zahlen sich aus.`:`An schlechten Tagen trainierst du im Schnitt sogar lockerer (<b class="num">${(-diff).toFixed(1)}</b> RPE-Punkte) – klug dosiert.`}</div>`;}
  else ins.innerHTML=`<div class="small muted">Mit mehr Trainings an guten und schlechten Tagen wird hier ein Vergleich daraus.</div>`;
}
function attachTooltips(box){
  const wrap=box.querySelector('.chartwrap'),svg=box.querySelector('svg');if(!svg)return;let tip=null;
  const show=t=>{if(!tip){tip=document.createElement('div');tip.className='tooltip';wrap.appendChild(tip);}tip.textContent=t.dataset.tip;const vb=svg.viewBox.baseVal,r=svg.getBoundingClientRect();tip.style.left=(+t.dataset.x/vb.width*r.width)+'px';tip.style.top=(+t.dataset.y/vb.height*r.height)+'px';tip.hidden=false;};
  const hide=()=>{if(tip)tip.hidden=true;};
  svg.querySelectorAll('[data-tip]').forEach(t=>{t.addEventListener('pointerenter',()=>show(t));t.addEventListener('pointerdown',e=>{e.preventDefault();show(t);});t.addEventListener('pointerleave',hide);});
  svg.addEventListener('pointerleave',hide);
}

/* ========= Mehr ========= */
function renderMore(){
  main.innerHTML=`<h2>Mehr</h2>
   <section class="card stack"><h3>Einstellungen</h3>
     <div class="field"><label for="s-name">Dein Name (optional)</label><input class="input" id="s-name" value="${esc(S.settings.name)}" placeholder="z. B. Jonas" autocomplete="off"></div>
     <div class="field"><label>Pause zwischen Sätzen</label><div class="seg" id="s-rest">${[0,60,90,120,180].map(v=>`<button data-v="${v}" class="${S.settings.rest===v?'on':''}">${v?v+' s':'aus'}</button>`).join('')}</div></div>
     <div class="field"><label>Ton am Ende der Pause</label><div class="seg" id="s-sound"><button data-v="1" class="${S.settings.sound!==false?'on':''}">An</button><button data-v="0" class="${S.settings.sound===false?'on':''}">Aus</button></div>
       <div class="list" id="s-sounds" style="margin-top:4px">${SOUNDS.map(x=>`<div class="it" style="padding:9px 0"><button data-pickSound="${x.id}" style="flex:1;text-align:left;display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;border-radius:50%;border:2px solid ${(S.settings.soundId||'beep')===x.id?'var(--accent)':'var(--line)'};display:inline-flex;align-items:center;justify-content:center;flex:none">${(S.settings.soundId||'beep')===x.id?'<span style="width:10px;height:10px;border-radius:50%;background:var(--accent)"></span>':''}</span><span><span style="font-weight:600">${x.name}</span><br><span class="small muted">${x.desc}</span></span></button><button class="btn sm ghost" data-playSound="${x.id}" aria-label="${x.name} anhören">▶</button></div>`).join('')}</div></div>
     <div class="field"><label>Bildschirm während des Trainings anlassen</label><div class="seg" id="s-awake"><button data-v="1" class="${S.settings.awake!==false?'on':''}">An</button><button data-v="0" class="${S.settings.awake===false?'on':''}">Aus</button></div><div class="small muted">Ein gesperrtes Handy kann keinen Timer-Ton abspielen. Deshalb bleibt der Bildschirm an, solange ein Training läuft. Wird das Handy trotzdem gesperrt, rechnet der Timer beim Entsperren die Restzeit nach.</div></div>
     <div class="field"><label>Gewichtsschritt</label><div class="seg" id="s-step">${[1.25,2.5].map(v=>`<button data-v="${v}" class="${S.settings.step===v?'on':''}">± ${v.toLocaleString('de-DE')} kg</button>`).join('')}</div></div></section>
   <section class="card stack"><div class="row between"><h3>Übungen</h3><button class="btn sm" id="newex">+ Neue Übung</button></div>
     <div class="list">${S.exercises.map(e=>`<div class="it"><span>${esc(e.name)} <span class="small muted">${e.en&&e.en!==e.name?esc(e.en):''}</span></span><span class="row"><span class="tag">${{w:'kg',bw:'Körpergewicht',t:'Zeit'}[e.type]}</span>${e.custom?`<button class="small muted" data-delex="${e.id}" aria-label="Übung löschen">✕</button>`:''}</span></div>`).join('')}</div></section>
   <section class="card stack"><h3>Daten sichern & teilen</h3><p class="small muted" style="margin:0">Deine Daten liegen nur auf diesem Gerät. Mit dem Export bekommst du eine Datei, die du z. B. in iCloud sichern oder per AirDrop weitergeben kannst.</p>
     <div class="grid2"><button class="btn" id="exp">Exportieren</button><button class="btn" id="imp">Importieren</button></div>
     <button class="btn ghost block" id="exp-text">Als Text kopieren</button>
     <input type="file" id="impfile" accept=".json,application/json" class="sr"></section>
   <section class="card stack"><h3>Gut zu wissen</h3>
     <div class="small muted stack" style="gap:6px"><div><b style="color:var(--fg)">RPE</b> (Rate of Perceived Exertion) ist die Skala, mit der Sportwissenschaftler und Coaches die Anstrengung eines Satzes beschreiben. 10 = kein einziger Versuch mehr möglich, 8 = zwei wären noch gegangen (RIR 2).</div>
     <div><b style="color:var(--fg)">e1RM</b> ist dein geschätztes Maximalgewicht für eine Wiederholung, berechnet aus Gewicht und Wiederholungen (Epley-Formel). Es zeigt Fortschritt, auch wenn du nie wirklich bis zum Maximum gehst – was in deinem Alter auch die richtige Idee ist.</div>
     <div><b style="color:var(--fg)">Volumen</b> = Sätze × Wiederholungen × Gewicht. Ein guter Blick auf die Gesamtarbeit einer Woche.</div></div></section>
   <section class="card stack"><h3>Zurücksetzen</h3>${S.workouts.length||S.active?'':'<button class="btn block" id="demo">Beispieldaten laden</button>'}<button class="btn ghost danger block" id="wipe">Alle Daten löschen</button></section>
   <div class="small muted" style="text-align:center;padding:4px 0 10px">Eisenbuch · ${S.workouts.length} Trainings gespeichert</div>`;
  $('#s-name').addEventListener('input',e=>{S.settings.name=e.target.value.trim();save();});
  $('#s-rest').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.settings.rest=+b.dataset.v;save();renderMore();}));
  $('#s-step').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.settings.step=+b.dataset.v;save();renderMore();}));
  $('#s-sound').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.settings.sound=b.dataset.v==='1';save();renderMore();}));
  main.querySelectorAll('[data-playSound]').forEach(b=>b.addEventListener('click',()=>{unlockAudio();playSound(b.dataset.playsound);}));
  main.querySelectorAll('[data-pickSound]').forEach(b=>b.addEventListener('click',()=>{S.settings.soundId=b.dataset.picksound;S.settings.sound=true;save();unlockAudio();playSound(S.settings.soundId);renderMore();}));
  $('#s-awake').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.settings.awake=b.dataset.v==='1';save();if(!S.settings.awake)releaseWake();renderMore();}));
  $('#newex').addEventListener('click',()=>newExerciseSheet('',()=>renderMore()));
  main.querySelectorAll('[data-delex]').forEach(b=>b.addEventListener('click',()=>{const e=ex(b.dataset.delex);const used=S.workouts.some(w=>w.entries.some(en=>en.exId===e.id));confirmSheet('Übung löschen?',used?e.name+' kommt in gespeicherten Trainings vor und wird dort als „Unbekannt" angezeigt.':e.name+' wird aus der Liste entfernt.','Löschen',()=>{S.exercises=S.exercises.filter(x=>x.id!==e.id);save();renderMore();});}));
  $('#exp').addEventListener('click',exportData);
  $('#exp-text').addEventListener('click',exportText);
  $('#imp').addEventListener('click',()=>importSheet());
  $('#impfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importJson(r.result);r.readAsText(f);e.target.value='';});
  const d=$('#demo');if(d)d.addEventListener('click',()=>{loadDemo();render();});
  $('#wipe').addEventListener('click',()=>confirmSheet('Wirklich alles löschen?','Alle Trainings, Übungen und Einstellungen werden von diesem Gerät entfernt. Exportiere vorher, wenn du sie behalten willst.','Alles löschen',()=>{S=blank();S.settings.welcomed=true;save();toast('Alles gelöscht');render();}));
}
function newExerciseSheet(prefill,done){
  const groups=[...new Set(S.exercises.map(e=>e.group))];
  sheet(`<h2>Neue Übung</h2><div class="field"><label for="ne-name">Name</label><input class="input" id="ne-name" value="${esc(prefill)}" placeholder="z. B. Hip Thrust" autocomplete="off"></div>
   <div class="field"><label>Art</label><div class="seg" id="ne-type"><button data-v="w" class="on">Gewicht (kg)</button><button data-v="bw">Körpergewicht</button><button data-v="t">Zeit (s)</button></div></div>
   <div class="field"><label for="ne-group">Muskelgruppe</label><select class="sel" id="ne-group">${groups.map(g=>`<option>${esc(g)}</option>`).join('')}<option>Sonstiges</option></select></div>
   <button class="btn primary block" id="ok">Anlegen</button>`,root=>{let type='w';root.querySelectorAll('#ne-type button').forEach(b=>b.addEventListener('click',()=>{type=b.dataset.v;root.querySelectorAll('#ne-type button').forEach(c=>c.classList.toggle('on',c===b));}));
    root.querySelector('#ok').addEventListener('click',()=>{const name=root.querySelector('#ne-name').value.trim();if(!name){toast('Bitte einen Namen eingeben');return;}const e={id:'c_'+uid(),name,en:'',type,group:root.querySelector('#ne-group').value,custom:true};S.exercises.push(e);save();closeSheet();done(e.id);});
    setTimeout(()=>root.querySelector('#ne-name').focus(),50);});
}
function exportPayload(){const {active,draft,...rest}=S;return JSON.stringify({app:'eisenbuch',exported:new Date().toISOString(),...rest},null,1);}
const exportName=()=>'eisenbuch-'+todayStr()+'.json';
async function exportData(){
  const data=exportPayload();
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){try{await dl.save({filename:exportName(),data});toast('Exportiert');}catch(err){if(err&&err.code==='declined')return;throw err;}return;}}catch(err){}
  // Standalone-Fallback: normaler Browser-Download
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=exportName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('Exportiert');}
  catch(e){exportText();}
}
async function exportText(){const data=exportPayload();
  sheet(`<h2>Daten als Text</h2><p class="small muted" style="margin:0">Kopieren und z. B. in Notizen oder eine Nachricht einfügen. Zum Wiederherstellen unter „Importieren" einfügen.</p><textarea class="input" id="exp-ta" readonly style="min-height:160px;font-size:12px">${esc(data)}</textarea><button class="btn primary block" id="copy">Kopieren</button>`,root=>{root.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(data);toast('Kopiert');}catch(e){const ta=root.querySelector('#exp-ta');ta.focus();ta.select();toast('Jetzt manuell kopieren');}});});}
function importSheet(){sheet(`<h2>Importieren</h2><p class="small muted" style="margin:0">Eine zuvor exportierte Datei auswählen oder den kopierten Text einfügen. Die vorhandenen Daten auf diesem Gerät werden dabei ersetzt.</p><button class="btn block" id="pickfile">Datei auswählen</button><textarea class="input" id="imp-ta" placeholder="… oder Text hier einfügen"></textarea><button class="btn primary block" id="ok">Importieren</button>`,root=>{root.querySelector('#pickfile').addEventListener('click',()=>$('#impfile').click());root.querySelector('#ok').addEventListener('click',()=>importJson(root.querySelector('#imp-ta').value));});}
function importJson(text){try{const d=JSON.parse(text);if(!d||d.app!=='eisenbuch'||!Array.isArray(d.workouts))throw 0;const b=blank();S={...b,...d,active:null,settings:{...b.settings,...(d.settings||{}),welcomed:true}};save();closeSheet();toast(d.workouts.length+' Trainings importiert');render();}catch(e){toast('Das ist keine gültige Eisenbuch-Datei');}}

/* ========= Beispieldaten ========= */
function loadDemo(){
  const b=blank(); b.settings.demo=true; b.settings.welcomed=true; b.settings.name='';
  const plan=[['squat','bench','row','plank'],['deadlift','ohp','pullup','curl']];
  const base={squat:40,bench:30,row:35,deadlift:50,ohp:20,curl:8}; const rnd=(a,c)=>a+Math.floor(Math.random()*(c-a+1));
  const today=new Date(todayStr()+'T12:00:00'); let k=0;
  for(let d=63;d>=1;d--){const date=new Date(today);date.setDate(today.getDate()-d);const dow=(date.getDay()+6)%7;if(![0,2,4].includes(dow))continue;if(Math.random()<0.12)continue;
    const prog=(63-d)/63; const ds=date.toISOString().slice(0,10); const start=new Date(date);start.setHours(16,rnd(0,59));
    const mood=rnd(2,5),sleep=rnd(2,5),energy=Math.min(5,Math.max(1,Math.round((mood+sleep)/2+rnd(-1,1)))),soreness=rnd(2,5);
    const form=(mood+sleep+energy)/3; const exs=plan[k++%2];
    const entries=exs.map(id=>{const e=b.exercises.find(x=>x.id===id);const sets=[];
      if(e.type==='t'){for(let s=0;s<3;s++)sets.push({w:0,reps:0,secs:Math.round(30+prog*40+rnd(-5,5)),rpe:rnd(6,9)});}
      else if(e.type==='bw'){for(let s=0;s<3;s++)sets.push({w:0,reps:Math.max(1,Math.round(3+prog*5-s+rnd(-1,1))),secs:0,rpe:Math.min(10,rnd(7,9)+(s===2?1:0))});}
      else{const w=Math.round((base[id]*(1+prog*0.3)+(form>3.5?1.25:0))/1.25)*1.25;for(let s=0;s<3;s++){const reps=Math.max(3,8-s+rnd(-1,1));sets.push({w,reps,secs:0,rpe:Math.min(10,Math.max(5,Math.round(7+s*0.5+(form<3?1:0)+rnd(-1,1))))});}}
      return {exId:id,sets};});
    b.workouts.push({id:uid(),date:ds,start:start.getTime(),end:start.getTime()+rnd(45,75)*60000,checkin:{mood,energy,sleep,soreness},note:Math.random()<0.2?['Kniebeuge lief richtig gut','Wenig Zeit, kürzer trainiert','Neue Schuhe, stabiler Stand','Müde, aber durchgezogen'][rnd(0,3)]:'',entries});}
  S=b; save();
}

/* ========= Start ========= */
render();
</script>
